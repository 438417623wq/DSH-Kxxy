## DSH Kxxy — Gradle 项目级设置
#
# 本机内存极度紧张：物理 8 GB，页面文件上限 8 GB，实测「可用虚拟内存」常低于
# 1 GB。Gradle 需要的是一大块**连续虚拟地址空间**，因此这里的取值逻辑是
# 「够用就好，越小越稳」，而不是越大越好。
#
# 三次失败的原因各不相同，全部记录在此避免重犯：
#   1) -Xmx2048m + 默认 daemon 策略
#      → daemon 被内核杀掉："Gradle build daemon disappeared unexpectedly"。
#   2) -Xmx4096m + kotlin.daemon.jvmargs=-Xmx2048m
#      → 两个 JVM 抢内存，Kotlin daemon 起不来：
#        "Could not connect to Kotlin compile daemon"，回退进程内编译时又 OOM。
#   3) -Xmx3072m + in-process
#      → JVM 直接写崩溃日志：
#        "Native memory allocation (mmap) failed to map 52428800 bytes.
#         Error detail: G1 virtual space"
#      → 关键是 **G1 会预留巨量虚拟空间**。改用 SerialGC 后，预留量大幅下降，
#        在小内存机器上反而更容易成功。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
# Kotlin 编译走同一进程，避免第二个 JVM
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 关掉 R 类的非传递命名空间检查开销与 lint 的额外 JVM
android.enableJetifier=false
