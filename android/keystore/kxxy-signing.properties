# DSH Kxxy —— 固定签名配置（入库，随仓库一起走）
#
# 为什么这份密码敢写进仓库：
#   本应用走 sideload 分发（不上架 Play），签名密钥的唯一职责是「让系统认可
#   这是同一个应用的升级包」。它不保护任何服务端凭据，也不参与应用内加密。
#   而丢掉它的代价是确定的：设备上已装的包无法覆盖升级，只能先卸载
#   （连 /data 下的引擎、会话、扩展一起清掉）。两害相权，入库。
#
# ⚠️ 代价要说清楚：拿到本仓库的人都能用这把钥匙签一个「看起来是 DSH Kxxy
#    升级包」的 APK。sideload 场景下这等价于「任何能改你手机的人都能改这个
#    应用」，与 Play 生态下的密钥泄露不可同日而语，但确实存在。
#
# ⚠️ 绝对不要重新生成这个 keystore。重新生成 = 换签名 = 老设备必须卸载。
#    需要备份时复制 kxxy-signing.jks 本身，不要用 keytool -genkeypair 造新的。

# 相对 android/keystore/ 的路径（gradle 与本文件的解析基准相同）
storeFile=kxxy-signing.jks
storePassword=kxxy-signing
keyAlias=kxxy
keyPassword=kxxy-signing

# 证书指纹（SHA-256，小写、无冒号）—— 构建期硬断言用。
# 打印方式：keytool -list -v -keystore kxxy-signing.jks -storepass kxxy-signing
certSha256=d08ae49973637a25ffb37cc0aac3ac71fa5812586b118e2e9439d6fa49b90373
