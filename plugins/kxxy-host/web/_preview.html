<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH Kxxy 控制台 — 渲染预览（三联屏）</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060a; }
  body {
    display: flex; gap: 24px; padding: 28px 20px 40px;
    justify-content: center; align-items: flex-start;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #151928 0%, #090b10 42%, #030406 100%);
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .cap { font-size: 12px; color: #9DA7B8; text-align: center; line-height: 1.4; }
  .cap em { font-style: normal; color: #5C6577; font-size: 10.5px; display: block; margin-top: 2px;
            font-family: "SF Mono", Consolas, monospace; }

  /* iPhone 16 Pro 机壳 */
  .phone {
    width: 390px; height: 800px; background: #000; border-radius: 50px;
    box-shadow: 0 0 0 3px #2c2d32, 0 0 0 5px #16171a, 0 0 0 9px #383a40,
                0 24px 56px rgba(0,0,0,.85);
    position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.18);
  }
  .phone iframe {
    width: 100%; height: 100%; border: 0; display: block; background: #0B0D13;
  }
  /* 灵动岛 */
  .island {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 116px; height: 30px; background: #000; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.1); z-index: 100; pointer-events: none;
  }
  .home {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 4px; background: rgba(255,255,255,.8);
    border-radius: 3px; z-index: 100; pointer-events: none;
  }
</style>
</head>
<body>

  <div class="col">
    <div class="phone">
      <div class="island"></div>
      <iframe src="harness-overview.html" title="概览"></iframe>
      <div class="home"></div>
    </div>
    <div class="cap">① 概览 · 引擎状态与运行时审计
      <em>engine-status + 指标 + 7 项完整性检查 + 13 补丁</em></div>
  </div>

  <div class="col">
    <div class="phone">
      <div class="island"></div>
      <iframe src="harness-extensions.html" title="扩展"></iframe>
      <div class="home"></div>
    </div>
    <div class="cap">② 扩展中心 · 19 项工具链
      <em>镜像源切换 + 分类标签 + 扩展卡片列表</em></div>
  </div>

  <div class="col">
    <div class="phone">
      <div class="island"></div>
      <iframe src="harness-terminal.html" title="终端"></iframe>
      <div class="home"></div>
    </div>
    <div class="cap">③ 终端 · xterm 风格实时日志
      <em>等宽渲染 + ANSI 着色 + 快捷键条</em></div>
  </div>

  <div class="col">
    <div class="phone">
      <div class="island"></div>
      <iframe src="harness-settings.html" title="设置"></iframe>
      <div class="home"></div>
    </div>
    <div class="cap">④ 设置 · 三级权限与保活
      <em>分段控件 + 开关组 + 危险操作区</em></div>
  </div>

</body>
</html>
