<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DSH Kxxy 控制台 · 全站改造稿</title>
<style>
/* ==========================================================================
   DSH Kxxy 控制台 · 全站改造稿（共享样式）
   设计语言：inset grouped list（分组卡 + 卡外分组标题）+ 单行式信息密度
   约束：WebView 104 可用 —— 不用 :has / color-mix / @container / dvh / 嵌套 CSS
   ========================================================================== */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #dfe2e7;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", sans-serif;
  padding: 22px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px 18px;
  align-items: flex-start;
}

.frame { width: 393px; }
.frame > figcaption {
  font-size: 12px; font-weight: 600; color: #4d5259;
  margin: 0 0 8px 4px; letter-spacing: .02em;
}
.frame > figcaption span { font-weight: 400; color: #7b8087; }

/* ── 手机外壳 ─────────────────────────────────────────────────────────── */
.phone {
  --bg: #f2f4f7;
  --card: #ffffff;
  --inset: #f7f8fa;
  --line: rgba(15, 17, 21, .07);
  --line-strong: rgba(15, 17, 21, .11);
  --t1: #0f1115;
  --t2: #61666b;
  --t3: #8b9096;
  --accent: #4176e6;
  --accent-bg: #eaf1fe;
  --ok: #1f8a4c;
  --ok-bg: #e8f8ee;
  --warn: #b06a10;
  --warn-bg: #fdf3e3;
  --err: #cf3a30;
  --err-bg: #fdecea;
  --shadow: 0 1px 2px rgba(15, 17, 21, .04), 0 8px 24px rgba(15, 17, 21, .06);

  width: 393px;
  height: 873px;
  background: var(--bg);
  color: var(--t1);
  border-radius: 26px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 18px 42px rgba(15, 17, 21, .18), 0 0 0 1px rgba(15, 17, 21, .07);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.phone.dark {
  --bg: #101012;
  --card: #1b1b1d;
  --inset: #232326;
  --line: rgba(255, 255, 255, .08);
  --line-strong: rgba(255, 255, 255, .13);
  --t1: #f4f5f7;
  --t2: #a8adb4;
  --t3: #7d838b;
  --accent: #5b8cf7;
  --accent-bg: rgba(91, 140, 247, .14);
  --ok: #4ed17e;
  --ok-bg: rgba(78, 209, 126, .14);
  --warn: #f7ad31;
  --warn-bg: rgba(247, 173, 49, .14);
  --err: #f25a5a;
  --err-bg: rgba(242, 90, 90, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}

/* 状态栏占位（真机是系统状态栏，这里只画个示意） */
.statusbar {
  height: 24px; flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; font-size: 11px; font-weight: 600; color: var(--t2);
}

/* ── 顶部导航 ─────────────────────────────────────────────────────────── */
.nav {
  flex: none;
  height: 50px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
}
.nav-logo {
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--accent-bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); flex: none;
}
.nav-title { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.nav-sub { font-size: 11px; color: var(--t3); font-weight: 500; }
.nav-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.nav-pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px; border-radius: 999px;
  background: var(--ok-bg); color: var(--ok);
  font-size: 12px; font-weight: 600;
}
.nav-pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: block; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--t2); background: transparent; border: 0;
}
.icon-btn.soft { background: var(--card); box-shadow: 0 0 0 1px var(--line); }
.text-btn { font-size: 13px; font-weight: 600; color: var(--accent); background: 0; border: 0; }

/* ── 滚动区 ───────────────────────────────────────────────────────────── */
.scroll {
  flex: 1;
  overflow: hidden;
  padding: 4px 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ── 分组 ─────────────────────────────────────────────────────────────── */
.grp-head {
  display: flex; align-items: baseline; gap: 8px;
  padding: 0 4px 7px;
}
.grp-title { font-size: 12.5px; font-weight: 600; color: var(--t3); letter-spacing: .03em; }
.grp-title.plain { color: var(--t2); }
.grp-link { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.grp {
  background: var(--card);
  border-radius: 14px;
  box-shadow: 0 0 0 1px var(--line);
  overflow: hidden;
}
.grp + .grp { margin-top: 0; }

/* ── 行 ───────────────────────────────────────────────────────────────── */
.row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  position: relative;
}
.row + .row::before {
  content: ""; position: absolute; left: 14px; right: 0; top: 0;
  height: 1px; background: var(--line);
}
.row.has-ico + .row.has-ico::before { left: 56px; }
.row-main { min-width: 0; flex: 1; }
.row-title { font-size: 15px; font-weight: 550; letter-spacing: -.005em; }
.row-title.sm { font-size: 14.5px; }
.row-sub {
  font-size: 12px; color: var(--t3); margin-top: 2px;
  line-height: 1.35;
}
.row-sub.mono { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 11px; }
.row-tail { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.row-val { font-size: 13px; color: var(--t3); }
.chev { color: var(--t3); flex: none; opacity: .85; }

.row-ico {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--inset); color: var(--t2);
}
.row-ico.blue { background: var(--accent-bg); color: var(--accent); }
.row-ico.green { background: var(--ok-bg); color: var(--ok); }
.row-ico.amber { background: var(--warn-bg); color: var(--warn); }
.row-ico.red { background: var(--err-bg); color: var(--err); }

/* ── 状态胶囊 ─────────────────────────────────────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: var(--inset); color: var(--t2);
}
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.err { background: var(--err-bg); color: var(--err); }
.chip.blue { background: var(--accent-bg); color: var(--accent); }
.chip.mono { font-family: "SF Mono", Consolas, Menlo, monospace; font-weight: 500; letter-spacing: -.02em; }

/* ── 按钮 ─────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 14px; border-radius: 10px; border: 0;
  font-size: 13px; font-weight: 650; font-family: inherit;
}
.btn.pri { background: var(--accent); color: #fff; }
.btn.soft { background: var(--inset); color: var(--t1); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: var(--err-bg); color: var(--err); }
.btn.block { width: 100%; height: 42px; border-radius: 12px; font-size: 14.5px; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
.btn.ghost { background: transparent; color: var(--accent); }

/* ── 引擎主卡（hero） ─────────────────────────────────────────────────── */
.hero {
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 0 0 1px var(--line), var(--shadow);
  overflow: hidden;
}
.hero-top { display: flex; align-items: flex-start; gap: 12px; padding: 15px 14px 14px; }
.hero-dot {
  width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px;
  background: var(--ok);
  box-shadow: 0 0 0 4px var(--ok-bg);
}
.hero-title { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.hero-actions { margin-left: auto; display: flex; gap: 6px; }

.stats { display: flex; border-top: 1px solid var(--line); }
.stat { flex: 1; padding: 10px 0 12px; text-align: center; position: relative; }
.stat + .stat::before {
  content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
  width: 1px; background: var(--line);
}
.stat-k { font-size: 11.5px; color: var(--t3); }
.stat-v {
  font-size: 17px; font-weight: 650; margin-top: 3px;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.stat-v small { font-size: 11.5px; font-weight: 600; color: var(--t3); margin-left: 1px; }

/* ── 内嵌提示条 ───────────────────────────────────────────────────────── */
.note {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 10px 12px; border-radius: 12px;
  background: var(--accent-bg);
  font-size: 12px; line-height: 1.45; color: var(--t2);
}
.note b { color: var(--t1); font-weight: 650; }
.note-ico { color: var(--accent); flex: none; margin-top: 1px; }

/* ── 标签 chip 行 ─────────────────────────────────────────────────────── */
.chips { display: flex; gap: 8px; padding: 0 2px; overflow: hidden; }
.tag {
  height: 30px; padding: 0 12px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 13px; font-weight: 550; color: var(--t2);
  background: var(--card); box-shadow: 0 0 0 1px var(--line);
  white-space: nowrap;
}
.tag.on { background: var(--t1); color: var(--bg); box-shadow: none; }
.tag small { font-size: 11px; opacity: .65; }

/* ── 搜索框 ───────────────────────────────────────────────────────────── */
.search {
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 12px; border-radius: 11px;
  background: var(--card); box-shadow: 0 0 0 1px var(--line);
  color: var(--t3); font-size: 13.5px;
}

/* ── 开关 ─────────────────────────────────────────────────────────────── */
.sw {
  width: 46px; height: 28px; border-radius: 999px; flex: none;
  background: var(--line-strong); position: relative;
}
.sw::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}
.sw.on { background: var(--ok); }
.sw.on::after { left: auto; right: 3px; }

/* ── 分段控件 ─────────────────────────────────────────────────────────── */
.seg {
  display: flex; gap: 3px; padding: 3px;
  background: var(--inset); border-radius: 10px;
}
.seg > span {
  flex: 1; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 550; color: var(--t2);
}
.seg > span.on {
  background: var(--card); color: var(--t1); font-weight: 650;
  box-shadow: 0 1px 3px rgba(15, 17, 21, .1), 0 0 0 1px var(--line);
}

/* ── 底栏 + 中央 FAB ──────────────────────────────────────────────────── */
.tabbar {
  flex: none; height: 68px; position: relative;
  display: flex; align-items: flex-start; padding: 0 6px;
  background: var(--card);
  box-shadow: 0 -1px 0 var(--line);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding-top: 9px; color: var(--t3); font-size: 10.5px; font-weight: 550;
}
.tab.on { color: var(--accent); }
.tab svg { width: 21px; height: 21px; }
.tab-gap { width: 66px; flex: none; }
.fab {
  position: absolute; left: 50%; transform: translateX(-50%); top: -20px;
  width: 54px; height: 54px; border-radius: 18px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 18px rgba(65, 118, 230, .38), 0 0 0 5px var(--bg);
}

/* ── 弹层 ─────────────────────────────────────────────────────────────── */
.mask {
  position: absolute; inset: 0; background: rgba(9, 11, 15, .38);
}
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 8px 14px 18px;
  box-shadow: 0 -10px 30px rgba(0, 0, 0, .18);
}
.sheet-grip {
  width: 36px; height: 4px; border-radius: 999px;
  background: var(--line-strong); margin: 0 auto 10px;
}
.sheet-title { font-size: 16px; font-weight: 650; margin-bottom: 2px; }
.sheet-sub { font-size: 12px; color: var(--t3); margin-bottom: 12px; }
.sheet .grp { box-shadow: 0 0 0 1px var(--line); background: var(--inset); }
.sheet .row + .row::before { background: var(--line); }


  /* ── 页面级补充组件 ─────────────────────────────────────── */
  .radio {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    box-shadow: inset 0 0 0 1.5px var(--line-strong);
  }
  .radio.on {
    box-shadow: inset 0 0 0 2px var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .radio.on::after {
    content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--accent);
  }
  .row.muted { opacity: .55; }
  .err-line {
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 10.5px; color: var(--err);
    margin-top: 3px; word-break: break-all; line-height: 1.35;
  }
  .pending {
    position: absolute; left: 10px; right: 10px; bottom: 76px;
    background: var(--t1); color: var(--bg);
    border-radius: 14px; padding: 10px 12px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 24px rgba(15, 17, 21, .28);
  }
  .pending-t { font-size: 12px; line-height: 1.4; opacity: .85; }
  .pending-t b { font-weight: 650; opacity: 1; }
  .pending .btn { background: #fff; color: #0f1115; height: 30px; font-size: 12.5px; }
  .qr {
    height: 168px; border-radius: 14px; background: var(--inset);
    box-shadow: inset 0 0 0 1px var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--t3); font-size: 12px;
  }
  .qr-glyph {
    width: 84px; height: 84px; border-radius: 10px;
    background:
      linear-gradient(var(--t2), var(--t2)) 6px 6px / 22px 22px no-repeat,
      linear-gradient(var(--t2), var(--t2)) 56px 6px / 22px 22px no-repeat,
      linear-gradient(var(--t2), var(--t2)) 6px 56px / 22px 22px no-repeat,
      linear-gradient(var(--t2), var(--t2)) 38px 38px / 10px 10px no-repeat,
      linear-gradient(var(--t2), var(--t2)) 52px 52px / 8px 8px no-repeat,
      linear-gradient(var(--t2), var(--t2)) 62px 44px / 16px 6px no-repeat;
    opacity: .45;
  }
  .foot-note { font-size: 11px; color: var(--t3); padding: 0 6px; line-height: 1.5; }


  .sheet .grp { border-radius: 12px; }
  .panel-label { font-size: 12px; font-weight: 600; color: #4d5259; margin: 0 0 8px 4px; }
  /* 远程会话：细悬浮胶囊 */
  .chat-bg { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .bubble {
    max-width: 78%; padding: 10px 12px; border-radius: 14px;
    background: var(--card); box-shadow: 0 0 0 1px var(--line);
    font-size: 13.5px; line-height: 1.5;
  }
  .bubble.me { align-self: flex-end; background: var(--accent); color: #fff; box-shadow: none; }
  .floatbar {
    position: absolute; left: 50%; transform: translateX(-50%); top: 54px;
    height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
    display: flex; align-items: center; gap: 7px;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 4px 14px rgba(15, 17, 21, .14), 0 0 0 1px rgba(15, 17, 21, .06);
    font-size: 11.5px; font-weight: 550; color: #0f1115; white-space: nowrap;
  }
  .floatbar .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
  .floatbar .sep { width: 1px; height: 12px; background: rgba(15,17,21,.12); }
  .floatbar .dim { color: #61666b; font-weight: 500; }

</style>
</head>

<!-- ══════════════ ① 概览 ══════════════ -->
<figure class="frame">
  <figcaption>① 概览 <span>· 引擎 / 远程 / 诊断 / 维护，四组一屏</span></figcaption>
  <div class="phone">
